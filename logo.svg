<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090C"/>
      <stop offset="50%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glowing Cyan Gradient for Wireframe -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Face Fill Gradients -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.10"/>
    </linearGradient>
    
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="780" height="200" rx="24" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="125" cy="110" r="65" fill="#06B6D4" opacity="0.22" filter="url(#ambientGlow)"/>

  <!-- Tech Grid Background Circles -->
  <g opacity="0.25" stroke="#38BDF8" stroke-width="0.75" fill="none">
    <circle cx="125" cy="110" r="75" stroke-dasharray="4 6"/>
    <circle cx="125" cy="110" r="58" stroke-width="0.5"/>
    <circle cx="125" cy="110" r="42" stroke-dasharray="2 4"/>
  </g>

  <!-- 3D ISOMETRIC CUBE LOGO MARK (Center: 125, 110 | Radius: 48) -->
  <!-- Vertices:
       P0 (center): 125, 110
       P1 (top): 125, 62
       P2 (bottom): 125, 158
       P3 (top-left): 83.43, 86
       P4 (top-right): 166.57, 86
       P5 (bottom-left): 83.43, 134
       P6 (bottom-right): 166.57, 134
  -->
  <g filter="url(#neonGlow)">
    <!-- Top Face -->
    <path d="M 125,110 L 83.43,86 L 125,62 L 166.57,86 Z" fill="url(#topFace)"/>
    
    <!-- Left Face -->
    <path d="M 125,110 L 83.43,86 L 83.43,134 L 125,158 Z" fill="url(#leftFace)"/>
    
    <!-- Right Face -->
    <path d="M 125,110 L 166.57,86 L 166.57,134 L 125,158 Z" fill="url(#rightFace)"/>

    <!-- Outer Wireframe Hexagon -->
    <path d="M 125,62 L 166.57,86 L 166.57,134 L 125,158 L 83.43,134 L 83.43,86 Z" 
          fill="none" stroke="url(#cyanGlow)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Internal Y-Junction Lines -->
    <path d="M 125,110 L 83.43,86
             M 125,110 L 166.57,86
             M 125,110 L 125,158" 
          fill="none" stroke="url(#cyanGlow)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Glowing Vertex Nodes -->
    <circle cx="125" cy="110" r="3.5" fill="#FFFFFF"/>
    <circle cx="125" cy="62" r="2.5" fill="#22D3EE"/>
    <circle cx="166.57" cy="86" r="2.5" fill="#38BDF8"/>
    <circle cx="166.57" cy="134" r="2.5" fill="#818CF8"/>
    <circle cx="125" cy="158" r="2.5" fill="#22D3EE"/>
    <circle cx="83.43" cy="134" r="2.5" fill="#38BDF8"/>
    <circle cx="83.43" cy="86" r="2.5" fill="#818CF8"/>
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <!-- "Zhypix" Title -->
  <text x="215" y="112" 
        fill="#FFFFFF" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="3">Zhypix</text>

  <!-- Cyan Sparkle Dot on 'i' or accent -->
  <circle cx="365" cy="64" r="4" fill="#22D3EE" filter="url(#neonGlow)"/>

  <!-- Subtitle Tag / Badge -->
  <rect x="218" y="132" width="480" height="28" rx="6" fill="#06B6D4" fill-opacity="0.12" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1"/>
  
  <text x="228" y="151" 
        fill="#38BDF8" 
        font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" 
        font-size="12" 
        font-weight="700" 
        letter-spacing="2">AUTONOMOUS VOICE AI &amp; TERMINAL COMPANION</text>
</svg>
