<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Dark background gradient matching ic_launcher_background.xml -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0B"/>
      <stop offset="50%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>

    <!-- Subtle border stroke -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3038" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1E1E24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2E3038" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Subtle white glow for cube edges -->
    <filter id="whiteGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded Squircle Icon Container -->
  <rect x="10" y="10" width="180" height="180" rx="42" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- High-tech circular grid lines behind logo (from ic_launcher_background.xml) -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#222228" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#2A2A32" stroke-width="1"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#1F1F24" stroke-width="1"/>
  </g>

  <!-- Isometric Black Cube with Crisp White Edges (Exact copy of ic_launcher_foreground.xml) -->
  <g transform="translate(100, 100) scale(1.85)">
    <!-- Base black shadow fill -->
    <path d="M 0,-28.8 L 26.16,-14.4 L 26.16,14.4 L 0,28.8 L -26.16,14.4 L -26.16,-14.4 Z" fill="#000000"/>

    <!-- Top Face (white translucency) -->
    <path d="M 0,0 L -26.16,-14.4 L 0,-28.8 L 26.16,-14.4 Z" fill="#FFFFFF" fill-opacity="0.15"/>
    
    <!-- Left Face (white translucency) -->
    <path d="M 0,0 L -26.16,-14.4 L -26.16,14.4 L 0,28.8 Z" fill="#FFFFFF" fill-opacity="0.08"/>
    
    <!-- Right Face (white translucency) -->
    <path d="M 0,0 L 26.16,-14.4 L 26.16,14.4 L 0,28.8 Z" fill="#FFFFFF" fill-opacity="0.11"/>

    <!-- Glow layer for outer wireframe -->
    <path d="M 0,-28.8 L 26.16,-14.4 L 26.16,14.4 L 0,28.8 L -26.16,14.4 L -26.16,-14.4 Z"
          fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" stroke-opacity="0.4" filter="url(#whiteGlow)"/>

    <!-- Crisp Outer Hexagon Wireframe -->
    <path d="M 0,-28.8 L 26.16,-14.4 L 26.16,14.4 L 0,28.8 L -26.16,14.4 L -26.16,-14.4 Z"
          fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Three Internal Edges Meeting at Center -->
    <path d="M 0,0 L -26.16,-14.4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0,0 L 26.16,-14.4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0,0 L 0,28.8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
