<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090C"/>
      <stop offset="50%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Face Fill Gradients for Cube -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.15"/>
    </linearGradient>
    
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.10"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
    </filter>

    <style>
      .msg {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace, sans-serif;
        font-size: 18px;
        font-weight: 600;
        fill: #E2E8F0;
        opacity: 0;
        animation-duration: 18s;
        animation-iteration-count: infinite;
        animation-timing-function: ease-in-out;
      }
      
      .msg1 { animation-name: cycle1; }
      .msg2 { animation-name: cycle2; }
      .msg3 { animation-name: cycle3; }
      .msg4 { animation-name: cycle4; }
      .msg5 { animation-name: cycle5; }
      .msg6 { animation-name: cycle6; }

      @keyframes cycle1 {
        0%, 14% { opacity: 1; transform: translateY(0px); }
        16%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes cycle2 {
        0%, 15% { opacity: 0; transform: translateY(4px); }
        17%, 30% { opacity: 1; transform: translateY(0px); }
        32%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes cycle3 {
        0%, 32% { opacity: 0; transform: translateY(4px); }
        34%, 47% { opacity: 1; transform: translateY(0px); }
        49%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes cycle4 {
        0%, 49% { opacity: 0; transform: translateY(4px); }
        51%, 63% { opacity: 1; transform: translateY(0px); }
        65%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes cycle5 {
        0%, 65% { opacity: 0; transform: translateY(4px); }
        67%, 80% { opacity: 1; transform: translateY(0px); }
        82%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes cycle6 {
        0%, 82% { opacity: 0; transform: translateY(4px); }
        84%, 97% { opacity: 1; transform: translateY(0px); }
        99%, 100% { opacity: 0; transform: translateY(-4px); }
      }

      .prompt-arrow {
        fill: #22D3EE;
        font-weight: bold;
      }

      .cursor {
        fill: #22D3EE;
        font-weight: bold;
        animation: blink 0.8s infinite;
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .prompt-label {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 12px;
        font-weight: 700;
        fill: #06B6D4;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="780" height="140" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="85" cy="80" r="45" fill="#06B6D4" opacity="0.20" filter="url(#ambientGlow)"/>

  <!-- Isometric Cube Logo (scaled down from logo.svg) -->
  <g transform="translate(85, 80) scale(0.65)">
    <!-- Back Wireframe Glow -->
    <path d="M 0,-45 L 39,-22.5 L 39,22.5 L 0,45 L -39,22.5 L -39,-22.5 Z" fill="none" stroke="url(#cyanGlow)" stroke-width="2" opacity="0.4" filter="url(#neonGlow)"/>
    <!-- Top Face -->
    <path d="M 0,-45 L 39,-22.5 L 0,0 L -39,-22.5 Z" fill="url(#topFace)" stroke="#22D3EE" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Left Face -->
    <path d="M -39,-22.5 L 0,0 L 0,45 L -39,22.5 Z" fill="url(#leftFace)" stroke="#38BDF8" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Right Face -->
    <path d="M 0,0 L 39,-22.5 L 39,22.5 L 0,45 Z" fill="url(#rightFace)" stroke="#818CF8" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Inner Cyan Core Glow -->
    <circle cx="0" cy="0" r="6" fill="#22D3EE" filter="url(#neonGlow)"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Chat Input Box Background -->
  <rect x="155" y="32" width="600" height="96" rx="14" fill="#0F172A" fill-opacity="0.6" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Status / Prompt Label -->
  <g transform="translate(180, 56)">
    <circle cx="0" cy="-3" r="4" fill="#22D3EE" filter="url(#neonGlow)"/>
    <text x="14" y="1" class="prompt-label">GUEST@ZHYPIX ~ CHAT &amp; TERMINAL PROMPT</text>
  </g>

  <!-- Cycling Typewriter Phrases (From ChatScreen.kt TypewriterText) -->
  <g transform="translate(180, 96)">
    <text x="0" y="0" class="msg msg1"><tspan class="prompt-arrow">&gt; </tspan>How can I help you today? <tspan class="cursor">|</tspan></text>
    <text x="0" y="0" class="msg msg2"><tspan class="prompt-arrow">&gt; </tspan>Run terminal commands &amp; execute scripts... <tspan class="cursor">|</tspan></text>
    <text x="0" y="0" class="msg msg3"><tspan class="prompt-arrow">&gt; </tspan>Automate device navigation &amp; app tasks... <tspan class="cursor">|</tspan></text>
    <text x="0" y="0" class="msg msg4"><tspan class="prompt-arrow">&gt; </tspan>Inspect screen content &amp; analyze UI... <tspan class="cursor">|</tspan></text>
    <text x="0" y="0" class="msg msg5"><tspan class="prompt-arrow">&gt; </tspan>Generate code, build tools, &amp; solve tasks... <tspan class="cursor">|</tspan></text>
    <text x="0" y="0" class="msg msg6"><tspan class="prompt-arrow">&gt; </tspan>Type any prompt or tap to try it out! <tspan class="cursor">|</tspan></text>
  </g>
</svg>
